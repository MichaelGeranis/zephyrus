name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first — it may already be planned or discussed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like Zephyrus to do.
    validations:
      required: true
  - type: textarea
    id: governance
    attributes:
      label: Effect on approvals and audit trail
      description: >
        Zephyrus is built around human approval gates and an auditable pipeline.
        Does this change who approves what, or what gets recorded?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
