name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Zephyrus.sln

      - name: Build
        run: dotnet build Zephyrus.sln --no-restore --configuration Release

      # Run each test project as its own step so both report separately — a
      # single solution-wide run makes it hard to tell whether a project was
      # actually executed.
      - name: Test (unit)
        run: dotnet test tests/Zephyrus.UnitTests/Zephyrus.UnitTests.csproj --no-build --configuration Release

      - name: Test (integration)
        run: dotnet test tests/Zephyrus.IntegrationTests/Zephyrus.IntegrationTests.csproj --no-build --configuration Release

  frontend:
    name: Typecheck and build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Zephyrus.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/Zephyrus.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
