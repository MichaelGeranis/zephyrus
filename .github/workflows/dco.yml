name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Commits are signed off
    runs-on: ubuntu-latest
    # Dependabot cannot sign off; its updates are reviewed like any other PR.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email=$(git log -1 --format='%ae' "$sha")
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                 | grep -qiF "<$email>"; then
              echo "ok   $(git log -1 --format='%h %s' "$sha")"
            else
              echo "FAIL $(git log -1 --format='%h %s' "$sha") — no sign-off for <$email>"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo
            echo "Every commit must be signed off. See CONTRIBUTING.md, or run:"
            echo "  git rebase --signoff $BASE_SHA && git push --force-with-lease"
            exit 1
          fi
