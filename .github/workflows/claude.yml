name: Claude Code
# No id-token: the action authenticates with the API key and github_token
# below, so it never needs an OIDC token.
permissions:
  contents: write
  pull-requests: write
  issues: write
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    # On a public repository anyone can comment. Run only for the owner and
    # collaborators, and only when Claude is mentioned, so nobody else can
    # spend the API key or act with this workflow's write permissions.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Leave no write token in .git/config for anything else in the job to
          # read; the action is given github_token explicitly.
          persist-credentials: false
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Responds to @claude mentions in comments